[21:49, 07/09/2026] Tony: <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier League Survivor</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    .logout-button {
      background: #ddd;
      color: #222;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #b00020;
      white-space: pre-wrap;
    }

    #dashboard {
      display: none;
    }

    .menu-button {
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏆 Premier League Survivor</h1>

    <!-- LOGIN -->
    <div id="login-card" class="card">
      <h2>Admin Login</h2>

      <input
        type="email"
        id="email"
        placeholder="Email address"
        style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        style="width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;"
      >

      <button onclick="login()">Login</button>

      <p id="login-status"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">

      <div class="card">
        <h2>Competition</h2>
        <p id="competition">Loading...</p>
      </div>

      <div class="card">
        <h2>Players</h2>
        <p id="players">Loading...</p>
        <button class="menu-button" onclick="managePlayers()">
          👥 Manage Players
        </button>
      </div>

      <div class="card">
        <h2>Current Week</h2>
        <p id="week">Loading...</p>
      </div>

      <div class="card">
        <h2>Admin Menu</h2>

        <button class="menu-button" onclick="managePlayers()">
          👥 Manage Players
        </button>

        <button class="menu-button" onclick="comingSoon('Weeks')">
          📅 Manage Weeks
        </button>

        <button class="menu-button" onclick="comingSoon('Fixtures')">
          ⚽ Manage Fixtures
        </button>

        <button class="menu-button" onclick="comingSoon('Selections')">
          📝 Manage Selections
        </button>

        <button class="menu-button" onclick="comingSoon('Results')">
          🏆 Enter Results
        </button>

        <button class="menu-button" onclick="comingSoon('Reports')">
          📊 Weekly Reports
        </button>
      </div>

      <div class="card">
        <h2>Status</h2>
        <p id="status">Loading...</p>
      </div>

      <div class="card">
        <button class="logout-button" onclick="logout()">
          Logout
        </button>
      </div>

    </div>

  </div>

  <script>

    const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    async function login() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("login-status");

      status.textContent = "Logging in...";
      status.className = "";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        status.textContent =
          "Login failed ❌\n" + error.message;

        status.className = "error";

        return;
      }

      status.textContent =
        "Login successful ✅";

      status.className = "success";

      showDashboard();
    }


    async function showDashboard() {

      document.getElementById("login").style.display =
        "none";

      document.getElementById("dashboard").style.display =
        "block";

      await loadDashboard();
    }


    async function loadDashboard() {

      const statusElement =
        document.getElementById("status");

      try {

        const {
          data: competition,
          error: competitionError
        } =
          await supabaseClient
            .from("competitions")
            .select("id,name,status")
            .eq("id", 1);

        if (competitionError)
          throw competitionError;

        if (!competition || competition.length === 0)
          throw new Error("Competition not found.");


        const {
          data: players,
          error: playersError
        } =
          await supabaseClient
            .from("competition_players")
            .select("id")
            .eq("competition_id", 1);

        if (playersError)
          throw playersError;


        const {
          data: weeks,
          error: weeksError
        } =
          await supabaseClient
            .from("weeks")
            .select("week_number,status")
            .eq("competition_id", 1)
            .order("week_number", {
              ascending: false
            })
            .limit(1);

        if (weeksError)
          throw weeksError;


        document.getElementById("competition").textContent =
          competition[0].name +
          " (" +
          competition[0].status +
          ")";


        document.getElementById("players").textContent =
          players.length + " players";


        if (weeks.length > 0) {

          document.getElementById("week").textContent =
            "Week " +
            weeks[0].week_number +
            " (" +
            weeks[0].status +
            ")";

        } else {

          document.getElementById("week").textContent =
            "No weeks found";
        }


        statusElement.textContent =
          "Connected to Supabase ✅";

        statusElement.className =
          "success";

      } catch (error) {

        statusElement.textContent =
          "Connection error ❌\n" +
          error.message;

        statusElement.className =
          "error";
      }
    }


    async function managePlayers() {
  const dashboard = document.getElementById("dashboard");

  dashboard.innerHTML = `
    <div class="card">
      <h2>👥 Manage Players</h2>
      <button onclick="location.reload()">← Back to Dashboard</button>
    </div>

    <div class="card">
      <h3>Add Player</h3>

      <input
        id="new-player-name"
        type="text"
        placeholder="Player name"
        style="width:100%; padding:10px; margin-bottom:10px;"
      >

      <input
        id="new-player-whatsapp"
        type="text"
        placeholder="WhatsApp number (optional)"
        style="width:100%; padding:10px; margin-bottom:10px;"
      >

      <button onclick="addPlayer()">Add Player</button>

      <p id="player-management-status"></p>
    </div>

    <div class="card">
      <h3>Current Players</h3>
      <div id="player-list">Loading players...</div>
    </div>
  `;

  await loadPlayers();
}


async function loadPlayers() {
  const playerList = document.getElementById("player-list");

  if (!playerList) return;

  playerList.innerHTML = "Loading players...";

  const { data, error } = await supabase
    .from("players")
    .select("id, name, whatsapp_number")
    .order("name");

  if (error) {
    console.error("Error loading players:", error);
    playerList.innerHTML =
      "Could not load players: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    playerList.innerHTML = "No players found.";
    return;
  }

  playerList.innerHTML = data
    .map(player => `
      <div style="padding:10px 0; border-bottom:1px solid #ddd;">
        <strong>${player.name}</strong>
        ${
          player.whatsapp_number
            ? <br><small>${player.whatsapp_number}</small>
            : ""
        }
      </div>
    `)
    .join("");
}
    function comingSoon(feature) {

      alert(
        feature +
        " management will be added next."
      );
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("dashboard").style.display =
        "none";

      document.getElementById("login").style.display =
        "block";

      document.getElementById("login-status").textContent =
        "Logged out.";
    }


    async function checkExistingLogin() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data.session)
        showDashboard();
    }


    checkExistingLogin();

  </script>

</body>
</html>
