<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier League Survivor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .loading {
      color: #666;
    }

    .error {
      color: #b00020;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🏆 Premier League Survivor</h1>
    <p>Admin Dashboard</p>

    <div class="card">
      <h2>Competition</h2>
      <p id="competition">Loading...</p>
    </div>

    <div class="card">
      <h2>Players</h2>
      <p id="players">Loading...</p>
    </div>

    <div class="card">
      <h2>Current Week</h2>
      <p id="week">Loading...</p>
    </div>

    <div class="card">
      <h2>Status</h2>
      <p id="status">Connecting to database...</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

    async function loadDashboard() {
      try {
        const competitionResponse = await fetch(
          ${SUPABASE_URL}/rest/v1/competitions?id=eq.1&select=id,name,status
          , {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": Bearer ${SUPABASE_KEY}
            }
          }
        );

        if (!competitionResponse.ok) {
          throw new Error("Could not connect to Supabase.");
        }

        const competitionData = await competitionResponse.json();

        if (competitionData.length === 0) {
          throw new Error("Competition ID 1 was not found.");
        }

        const competition = competitionData[0];

        const playersResponse = await fetch(
          ${SUPABASE_URL}/rest/v1/competition_players?competition_id=eq.1&select=id
          , {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": Bearer ${SUPABASE_KEY}
            }
          }
        );

        const playersData = await playersResponse.json();

        const weekResponse = await fetch(
          ${SUPABASE_URL}/rest/v1/weeks?competition_id=eq.1&order=week_number.desc&limit=1&select=week_number,status
          , {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": Bearer ${SUPABASE_KEY}
            }
          }
        );

        const weekData = await weekResponse.json();

        document.getElementById("competition").textContent =
          competition.name;

        document.getElementById("players").textContent =
          ${playersData.length} players;

        document.getElementById("week").textContent =
          weekData.length > 0
            ? Week ${weekData[0].week_number} (${weekData[0].status})
            : "No weeks found";

        document.getElementById("status").textContent =
          "Connected to Supabase ✅";

      } catch (error) {
        document.getElementById("status").textContent =
          "Connection error ❌";

        document.getElementById("status").className = "error";
        document.getElementById("status").textContent +=
          "\n" + error.message;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
