<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier League Survivor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .error {
      color: #b00020;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🏆 Premier League Survivor</h1>
    <p>Admin Dashboard</p>

    <div class="card">
      <h2>Competition</h2>
      <p id="competition">Loading...</p>
    </div>

    <div class="card">
      <h2>Players</h2>
      <p id="players">Loading...</p>
    </div>

    <div class="card">
      <h2>Current Week</h2>
      <p id="week">Loading...</p>
    </div>

    <div class="card">
      <h2>Status</h2>
      <p id="status">Connecting to database...</p>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://pkqzoxxjnzqaekhvnaku.supabase.co";
    const SUPABASE_KEY = "sb_publishable_KVbBNWyIhdykAQsUf_yvhA_rupOxGSR";

    async function getData(url) {
      const response = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      });

      if (!response.ok) {
        throw new Error("Supabase request failed: " + response.status);
      }

      return await response.json();
    }

    async function loadDashboard() {
      try {
        const competition = await getData(
          SUPABASE_URL +
          "/rest/v1/competitions?id=eq.1&select=id,name,status"
        );

        if (competition.length === 0) {
          throw new Error("Competition not found.");
        }

        const players = await getData(
          SUPABASE_URL +
          "/rest/v1/competition_players?competition_id=eq.1&select=id"
        );

        const weeks = await getData(
          SUPABASE_URL +
          "/rest/v1/weeks?competition_id=eq.1&order=week_number.desc&limit=1&select=week_number,status"
        );

        document.getElementById("competition").textContent =
          competition[0].name;

        document.getElementById("players").textContent =
          players.length + " players";

        if (weeks.length > 0) {
          document.getElementById("week").textContent =
            "Week " + weeks[0].week_number +
            " (" + weeks[0].status + ")";
        } else {
          document.getElementById("week").textContent =
            "No weeks found";
        }

        document.getElementById("status").textContent =
          "Connected to Supabase ✅";

      } catch (error) {

        document.getElementById("status").textContent =
          "Connection error ❌\n" + error.message;

        document.getElementById("status").className = "error";
      }
    }

    loadDashboard();
  </script>

</body>
</html>
